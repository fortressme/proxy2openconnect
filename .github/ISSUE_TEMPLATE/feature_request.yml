name: Feature request
description: 提议新功能或改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 描述需要解决的问题，而不只是期望的实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与兼容性影响
  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 此 Issue 不包含真实凭据或内部网络信息。
          required: true
