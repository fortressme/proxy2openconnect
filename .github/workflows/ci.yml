name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON and Python syntax
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path

          for path in (Path("app/core.py"), Path("app/main.py")):
              ast.parse(path.read_text(encoding="utf-8"))
          for path in Path("defaults").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          PY
      - name: Shell lint
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck entrypoint.sh scripts/*.sh
      - name: Docker build
        run: docker build --build-arg APP_VERSION="$(cat VERSION)" -t xray2cisco:ci .
