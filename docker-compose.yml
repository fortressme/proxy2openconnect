services:
  xray2cisco:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-0.1.0}"
    image: "${IMAGE_NAME:-xray2cisco}:${IMAGE_TAG:-0.1.0}"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      XRAY_VPN_OUTBOUND_TAGS: ${XRAY_VPN_OUTBOUND_TAGS:-vpn-out}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
      - "${BIND_ADDRESS:-127.0.0.1}:${SOCKS_PORT:-1080}:1080/tcp"
      - "${BIND_ADDRESS:-127.0.0.1}:${SOCKS_PORT:-1080}:1080/udp"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PROXY_PORT:-8080}:8080/tcp"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s
